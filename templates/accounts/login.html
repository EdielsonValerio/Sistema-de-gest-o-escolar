{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block anon %}
<div class="login-wrap">
  <div class="card login-card"><div class="card-body p-4">
    <div class="text-center mb-4"><i class="bi bi-mortarboard-fill fs-1" style="color:var(--brand)"></i><h1 class="h4 mt-2" style="color:var(--brand)">Gestão Escolar</h1><p class="text-muted small mb-0">Acesse com seu usuário e senha</p></div>
    {% if form.errors %}<div class="alert alert-danger py-2">Usuário ou senha incorretos.</div>{% endif %}
    <form method="post" novalidate data-once>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label" for="id_username">Usuário</label><input class="form-control" type="text" name="username" id="id_username" autofocus autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Senha</label><input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
  </div></div>
</div>
{% endblock %}
