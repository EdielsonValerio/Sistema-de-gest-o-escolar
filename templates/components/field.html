{% load ui %}
<div class="{% if field.widget_type == 'textarea' %}col-12{% elif field.widget_type == 'checkbox' %}col-12{% else %}col-md-6 col-lg-4{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <div class="form-check">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
  {% else %}
    <label class="form-label {% if field.field.required %}required-mark{% endif %}" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
