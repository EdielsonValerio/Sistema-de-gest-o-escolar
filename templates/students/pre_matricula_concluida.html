{% extends "base_publico.html" %}
{% block title %}Pré-matrícula enviada{% endblock %}
{% block content %}
<div class="card"><div class="card-body text-center py-5">
  <div class="display-4 text-success"><i class="bi bi-check-circle-fill"></i></div>
  <h1 class="h4 mt-2">{{ titulo }}</h1>
  {% if dados %}<p class="mb-1">Aluno: <strong>{{ dados.nome }}</strong></p><p class="text-muted">Código de referência: <code>{{ dados.codigo }}</code></p>{% endif %}
  <p class="mb-0">{{ mensagem|linebreaksbr }}</p>
</div></div>
{% endblock %}
