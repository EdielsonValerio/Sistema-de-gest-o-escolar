{% extends "portal/base.html" %}
{% block title %}{{ doc.titulo }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3 no-print">
  <div><h1 class="h4 mb-0">{{ doc.titulo }}</h1><p class="text-muted mb-0">Documento nº {{ doc.numero }} · emitido em {{ doc.emitido_em|date:"d/m/Y H:i" }}</p></div>
  <div class="d-flex gap-2"><button type="button" class="btn btn-primary" data-print><i class="bi bi-printer"></i> Imprimir / salvar em PDF</button><a class="btn btn-outline-secondary" href="{% url 'portal:documentos' %}">Voltar</a></div>
</div>
<div class="doc-folha">{{ doc.html|safe }}</div>
{% endblock %}
