{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="mb-3">
  <h1 class="h4 page-title">{{ titulo }}</h1>
  {% if subtitulo %}<p class="page-sub">{{ subtitulo }}</p>{% endif %}
</div>
<form method="post" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %} novalidate data-once>
  {% csrf_token %}
  <div class="card"><div class="card-body">
    {% include "components/form_fields.html" %}
  </div>
  <div class="card-footer bg-white d-flex gap-2 justify-content-end">
    <a class="btn btn-outline-secondary" href="{{ cancelar_url }}">Cancelar</a>
    <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> {{ botao|default:"Salvar" }}</button>
  </div></div>
</form>
{% endblock %}
