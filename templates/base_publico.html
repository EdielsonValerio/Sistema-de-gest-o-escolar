{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Pré-matrícula{% endblock %} · {{ escola.nome }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}?v=5" rel="stylesheet">
</head>
<body class="bg-light">
<header class="bg-white border-bottom">
  <div class="container py-3 d-flex align-items-center gap-3" style="max-width:980px">
    {% if escola.logotipo %}<img src="{{ escola.logotipo.url }}" alt="Logotipo {{ escola.nome }}" style="height:48px;width:auto">{% else %}<i class="bi bi-mortarboard-fill fs-2 text-primary"></i>{% endif %}
    <div><div class="fw-bold">{{ escola.nome }}</div><div class="small text-muted">Pré-matrícula online</div></div>
  </div>
</header>
<main class="container py-4" style="max-width:980px">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
